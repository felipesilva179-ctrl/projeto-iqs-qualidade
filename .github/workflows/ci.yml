name: Java CI & Security Pipeline (Aula 10)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Estágio de Build e Testes (Maven)
      - name: Compilar e Executar Testes Unitários
        run: mvn test --batch-mode

      # Estágio de Análise de Segurança de Dependências (OWASP Dependency-Check)
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'projeto-iqs-qualidade'
          path: '.'
          format: 'HTML'

      # Upload do relatório de segurança como artefato do GitHub Actions
      - name: Upload Relatório OWASP
        uses: actions/upload-artifact@v3
        with:
          name: relatorio-seguranca-owasp
          path: 'reports/'